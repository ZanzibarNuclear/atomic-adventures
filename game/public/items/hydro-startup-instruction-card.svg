<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Instruction card">
  <defs>
    <linearGradient id="card-face" x1="18" y1="10" x2="78" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="55%" stop-color="#d7e8f8"/>
      <stop offset="100%" stop-color="#b9d3ea"/>
    </linearGradient>
    <linearGradient id="card-edge" x1="20" y1="12" x2="76" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7eb6d8"/>
      <stop offset="100%" stop-color="#3f7fa8"/>
