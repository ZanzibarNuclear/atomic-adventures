  </defs>
  <!-- laminated card body -->
  <rect x="18" y="12" width="60" height="72" rx="7" fill="url(#card-face)" stroke="url(#card-edge)" stroke-width="3"/>
  <rect x="24" y="18" width="48" height="60" rx="4" fill="none" stroke="#8eb9d6" stroke-width="1.5" opacity="0.7"/>
  <!-- hydro / drop mark -->
