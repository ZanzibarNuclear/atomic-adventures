  <path d="M48 31c0 0-6.2 8.5-6.2 13.2a6.2 6.2 0 0 0 12.4 0C54.2 39.5 48 31 48 31z" fill="#e8f9ff" opacity="0.35"/>
  <!-- instruction lines -->
  <rect x="30" y="54" width="36" height="3.2" rx="1.6" fill="#5a7f9c" opacity="0.75"/>
  <rect x="30" y="61" width="28" height="3.2" rx="1.6" fill="#5a7f9c" opacity="0.55"/>
  <rect x="30" y="68" width="32" height="3.2" rx="1.6" fill="#5a7f9c" opacity="0.45"/>
