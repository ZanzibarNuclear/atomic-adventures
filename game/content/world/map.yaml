# World overview map for Atomic Adventures — Act I opening.
#
# HEX REFERENCE
# -------------
# Each hex has a unique `id` (kebab-case) — use this in story, flags, and code.
# Optional `label` overrides the caption; otherwise id is shown as Title Case
# (e.g. east-pines → East Pines). Landmark icons may have their own `label`.
# Action labels for travel come from story choices (part-i.yaml) or default
# compass wording ("Go west") from reachable directions — not authored here.
# Layout uses axial coordinates (q, r), pointy-top. North = decreasing r / screen-up.
#   https://www.redblobgames.com/grids/hexagons/
#
# Authoring routes & features: anchor waypoints to a hex with optional offsets
#   { hex: utility-yard, dx: -0.3, dy: 0.1 }
# dx/dy are in hex-size units (-y = north). Raw { x, y } world coords still work.
#
# stands — preferred places where the player can stand inside a hex:
#   - { id: east-bank, at: { dx: 0.45, dy: 0.15 } }
#   - { id: gate, at: { x: -81, y: -76 } }
#   - { id: entrance, at: { from: landmark, dx: 0.05, dy: -0.56 } }
# dx/dy are in hex-size units (-y = north). Multiple stands let authors place
# preferred arrival points on different accessible sides of barriers.
#
# Grid sketch (r increases downward on the slope):
#
#    upper-gorge (-1,-2)  road-fork (0,-2)   north-bend (0,-1)   far-pines (1,-1)
#    north-west (-2,-1)  gate-woods (-1,-1)   …
#       mid-west (-2,0)  west-slope (-1,0)   center-pines (0,0) …  origin (2,0)
#  utility-yard (-2,1) [utility station]  south-pines (-1,1)  lower-stand (0,1)
#
# River: upper-gorge → … → utility-yard (utility-falls cascade) → off SW.
# Roads: compound-road (paved) gate ↔ north ↔ NE stub at road-fork (0,-2).
#        river-access-drive (granite) — side road from road-fork west to the river.
#
# Passages (local barrier crossings inside one hex):
#   gate / hole — fence crossings   bridge / ford — river crossings
# Adjacent hex movement does not consume passages automatically; cross first,
# then move from the new stand position.
#   { kind: gate|hole|bridge|ford, hex: <hex-id>, visibility: obvious|hidden,
#     at: { hex, dx, dy } | { x, y }, radius?: px, label?: text }
# Optional passage state:
#   require: { all: [flag], any: [flag], not: [flag] }
#   unlock: { label: text, status: text, set_flags: [flag] }
#   on_cross: { set_flags: [flag] }

orientation: pointy
size: 44

start: origin
journey:
  [origin, east-pines, center-pines, north-bend, gate-woods, utility-yard]

hexes:
  - id: upper-gorge
    q: -1
    r: -2
    terrain: forest
    stands:
      - { id: east-bank, label: "East bank", at: { dx: 0.45, dy: 0.15 } } # inside hex (not road-fork)

  - id: road-fork
    q: 0
    r: -2
    terrain: forest
    stands:
      - { id: fork, label: "Road fork", at: { dx: -0.15, dy: 0.23 } }

  - id: north-west
    q: -2
    r: -1
    terrain: forest
    stands:
      - { id: east-bank, label: "East bank", at: { dx: 0.65, dy: 0 } }

  - id: north-bend
    q: 0
    r: -1
    terrain: forest
    stands:
      - { id: trail, label: "Trail", at: { x: -10, y: -70 } } # outside/east of compound fence (x: -30)

  - { id: far-pines, q: 1, r: -1, terrain: forest }

  - { id: origin, q: 2, r: 0, terrain: forest }

  - { id: east-pines, q: 1, r: 0, terrain: forest }

  - { id: center-pines, q: 0, r: 0, terrain: forest }

  - id: gate-woods
    q: -1
    r: -1
    terrain: forest
    stands:
      - { id: gate, label: "Gate", at: { x: -81, y: -76 } }
    landmark:
      label: "Compound Gate"
      blurb: "A locked fence gate and a guard booth."

  - id: mid-west
    q: -2
    r: 0
    terrain: forest
    stands:
      - { id: river-bank, label: "River bank", at: { dx: 0.23, dy: 0 } }

  - { id: west-slope, q: -1, r: 0, terrain: forest }

  - id: utility-yard
    q: -2
    r: 1
    terrain: clearing
    stands:
      - { id: entrance, label: "Entrance", at: { from: landmark, dx: 0.05, dy: -0.56 } }
    landmark:
      building: utility-station
      label: "Utility Station"
      dx: 0.06
      dy: 0.19
      blurb: "Built beside a rocky cascade on the river, this facility is the central location for Part I of our adventure."

  - { id: south-pines, q: -1, r: 1, terrain: forest }

  - { id: lower-stand, q: 0, r: 1, terrain: forest }

features:
  - id: mountain-river
    kind: river
    smooth: true
    flow: south
    points:
      - { hex: upper-gorge, dx: 0.56, dy: -0.57 }
      - { hex: north-west, dx: 0.52, dy: -0.42 }
      - { hex: mid-west, dx: -0.19, dy: -0.47 }
      - { hex: utility-yard, dx: -0.34, dy: -0.73 }
      - { hex: utility-yard, dx: -0.34, dy: 0.69 }
      - { x: -147, y: 130 }
    cascades:
      - { id: utility-falls, from: 0.62, to: 0.84 }

  - id: fence-run-south
    kind: fence
    points:
      - { x: -30, y: 140 }
      - { x: -30, y: -62 }

  - id: fence-run-west
    kind: fence
    points:
      - { x: -30, y: -62 }
      - { x: -164, y: -61 }

  - id: compound-gate
    kind: gate
    hex: gate-woods
    visibility: obvious
    at: { x: -81, y: -62 } # compound road crosses fence-run-west
    boothAt: { x: -94, y: -72 }
    require:
      all: [compound.gate-unlocked]
    unlock:
      label: "Solve the puzzle to unlock"
      status: "A locked gate blocks the road — look closer."
      set_flags: [compound.gate-unlocked]
    on_cross:
      set_flags: [compound.gate-passed]

  - id: upper-gorge-bridge
    kind: bridge
    hex: upper-gorge
    visibility: obvious
    at: { x: -138, y: -144 }

  - id: mid-west-ford
    kind: ford
    hex: mid-west
    visibility: hidden
    at: { hex: mid-west, dx: -0.19, dy: -0.47 }

  - id: south-pines-hole
    kind: hole
    hex: south-pines
    visibility: hidden
    at: { hex: south-pines, dx: 0.18, dy: 0 }

routes:
  - id: compound-road
    kind: road
    label: "main road"
    smooth: true
    points:
      - { x: -81, y: 150 }
      - { x: -81, y: 60 }
      - { x: -81, y: -40 }
      - { x: -81, y: -72 }
      - { x: -81, y: -76 }
      - { x: -82, y: -104 }
      - { hex: road-fork, dx: -0.07, dy: 0.16 }
      - { hex: road-fork, dx: 0.32, dy: -0.13 }
      - { hex: road-fork, dx: 0.66, dy: -0.55 }

  - id: river-access-drive
    kind: drive
    label: "vista drive"
    smooth: true
    points:
      - { hex: road-fork, dx: -0.15, dy: 0.23 }
      - { hex: upper-gorge, dx: 0.91, dy: 0.3 }
      - { x: -133, y: -130 }

  - id: station-driveway
    kind: drive
    label: "station driveway"
    points:
      - { x: -82, y: 50 }
      - { x: -105, y: 49 }
      - { hex: utility-yard, dx: 0.09, dy: -0.17 }
