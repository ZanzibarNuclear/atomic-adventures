# Utility Station interior — a top-down floor plan, drawn to match the design
# sketch. TWO floors share one footprint; the Large Bay (garage) is a single
# double-height room, so on the 2nd floor that footprint is "open to below".
#
# Orientation: layout +x = north, +y = east (compass-fixed; user rotation does not change these).
# Default map view: north up, aligned with the hex map. West (−y) faces the river cascade.
#
# Stacking:  Conference sits over Library; Kitchen sits over Small Bay;
#            the Large Bay spans both floors.
# Stairs:    Large Bay (garage) --straight stairs--> Conference (2nd floor)
#            Kitchen (2F) and Hallway (1F) open onto the river-side spiral stair
#            (a feature you can pause on — not just a through-route).
#            Library connects south through a sloping corridor to the control room.

id: utility-station
label: Utility Station
cell: 64

# Enables the micro-hydro generator overlay on the grid map.
# Positions derived from the exterior layout (unitFeet: 10).
hydroSystem: true
gridFeet: 10 # light floor-grid lines every 10 feet
unitFeet: 10 # one layout unit (room x/y/w/h) = 10 feet
start: large-bay
outdoorHex: utility-yard # hex where this building sits on the world map

# Cascade west (−y) of the building; layout +x is north, flow runs north → south.
# Close-up plan crops to the building-facing half — a western border, not crossable here.
river:
  offsetFeet: 10
  widthFeet: 15
  visibleFraction: 0.5
  onLevels: [first, second]

# Retaining wall west of the driveway — blocks the cliff drop to the river.
# Runs north→south (+x); thickness extends west (−y) toward the river.
cliffWall:
  onLevels: [first]
  thicknessFeet: 5
  extendNorthToMapEdge: true
  points:
    - { x: 4.2, y: 0.1 } # northeast corner of building footprint

# Footpaths and stand spots outside the building (1st-floor plan).
# Paths use smooth curves (Catmull-Rom) like the hex-map trails.
exterior:
  level: first
  entry: large-bay-roll-front
  pad: 1
  nodes:
    - id: small-bay-roll-front
      at: { x: 4.47, y: 1.02 }
      label: "EV bay roll-up"
      door: small-bay-roll
      room: small-bay
    - id: large-bay-roll-front
      at: { x: 4.46, y: 3.6 }
      label: "Large bay roll-up"
      door: large-bay-roll
      room: large-bay
    - id: north-east-corner
      at: { x: 4.42, y: 5.48 }
      label: "North-east corner"
    - id: large-bay-man-front
      at: { x: 0.61, y: 5.55 }
      label: "Large bay side door"
      door: large-bay-man
      room: large-bay
    - id: south-east-bend
      at: { x: -3.13, y: 5.34 }
      label: "South-east bend"
    - id: lobby-exterior-front
      at: { x: -4.4, y: 3.52 }
      label: "Control lobby"
      door: lobby-exterior
      room: control-lobby
    - id: south-east-corner
      at: { x: -6.34, y: 3.41 }
      label: "South-east corner"
    - id: downstream-bank
      at: { x: -5.39, y: -1.12 }
      label: "Riverbank downstream"
    - id: midstream-bank
      at: { x: -1.12, y: -1.11 }
      label: "Midstream bank"
    - id: upstream-bank
      at: { x: 3.54, y: -1.1 }
      label: "Riverbank upstream"
  paths:
    - id: driveway
      smooth: true
      nodes: [small-bay-roll-front, large-bay-roll-front]
      points:
        - { x: 4.09, y: 0.06 }
        - { x: 4.46, y: 1.04 }
        - { x: 4.48, y: 3.6 }
    - id: perimeter
      smooth: true
      nodes:
        [
          large-bay-roll-front,
          north-east-corner,
          large-bay-man-front,
          south-east-bend,
          lobby-exterior-front,
        ]
      points:
        - { x: 4.47, y: 3.61 }
        - { x: 4.49, y: 4.74 }
        - { x: 4.29, y: 5.53 }
        - { x: 2.81, y: 5.53 }
        - { x: 0.61, y: 5.55 }
        - { x: -1.52, y: 5.54 }
        - { x: -4, y: 4.99 }
        - { x: -4.39, y: 3.48 }
    - id: riverside
      smooth: false
      nodes:
        [
          lobby-exterior-front,
          south-east-corner,
          downstream-bank,
          midstream-bank,
          upstream-bank,
        ]
      points:
        - { x: -4.4, y: 3.52 }
        - { x: -6.34, y: 3.41 }
        - { x: -6.29, y: -0.21 }
        - { x: -5.39, y: -1.12 }
        - { x: -1.12, y: -1.11 }
        - { x: 3.54, y: -1.1 }
    - id: river-stairs
      smooth: false
      nodes: [small-bay-roll-front, upstream-bank]
      points:
        - { x: 3.54, y: -1.1 }
        - { x: 4.09, y: 0.06 }

# Hex-map transition points — geographic waypoints where the floor-plan view
# hands off to the hex world map.  Not door-associated; just location markers.
transitions:
  - id: garage-exit
    label: "Leave through the garage"
    at: { x: 5.11, y: 2.39 }
    hex: utility-yard

  - id: man-door-path
    label: "Pass through the woods to the road"
    exteriorNode: large-bay-man-front
    at: { x: 0.58, y: 6.28 }
    hex: utility-yard

  - id: southeast-corner
    label: "Stroll to the living quarters"
    exteriorNode: south-east-corner
    at: { x: -6.71, y: 4.12 }
    hex: utility-yard

  - id: river-walk
    label: "Walk upstream along the riverbank to the vista point"
    exteriorNode: upstream-bank
    at: { x: 4.81, y: -1.13 }
    hex: utility-yard

# Highest order is the top floor.
levels:
  - { id: second, label: "2nd Floor", order: 1 }
  - { id: first, label: "1st Floor", order: 0 }

rooms:
  # ---------------- 1st floor (ground) ----------------
  - id: library
    level: first
    x: -1
    y: 0
    w: 2
    h: 2
    label: "Library"
    icon: "📚"
    windows: [west] # river side
    blurb: "Shelves, manuals, log binders, and three holo-reader stations. Windows covered by sliding blinds. Views of the river cascade."
  - id: corridor
    level: first
    windows: [west] # river side
    x: -3
    y: 0.2
    w: 2
    h: 0.5
    label: "Corridor"
    blurb: "A narrow passage sloping downhill away from the station — conduit runs, pipe insulation, and a draft of cool air from below."
  - id: control-room
    level: first
    x: -6
    y: 0
    w: 3
    h: 2
    label: "Control Room"
    icon: "🎛️"
    windows: [west] # river side
    revealWhenDoor: corridor-control # peek once the downhill door opens
    blurb: "Plant controls and monitoring gear for the utility station — breaker panels, annunciators, and a wall of labeled switches."
  - id: control-lobby
    level: first
    x: -6
    y: 2
    w: 2
    h: 1
    label: "Lobby"
    icon: "🛎️"
    blurb: "Entrance to the control room"
  - id: control-bathroom
    level: first
    x: -4
    y: 2
    w: 1
    h: 1
    label: "Bathroom"
    icon: "🚽"
    blurb: "When operators have to go"
  - id: hallway
    level: first
    x: 1
    y: 0
    w: 1
    h: 0.8 # 8 ft — corridor above the bathroom
    label: "Hallway"
    blurb: "A short passage between the library, small bay, and spiral stair. Doors line the west (river) wall and the north and south ends."
  - id: bathroom
    level: first
    x: 1
    y: 0.8
    w: 1
    h: 1.2 # 12 ft — slightly deeper than the hallway
    label: "Bathroom"
    icon: "🚽"
    blurb: "A compact washroom off the hallway — sink, toilet, and a frosted window onto the cascade. Smells faintly of old soap."
  - id: small-bay
    level: first
    x: 2
    y: 0
    w: 2
    h: 2
    label: "Small Bay"
    icon: "🔧"
    note: "1 story · EV bay"
    rollDoor: north # roll-up onto the driveway (north wall)
    rollSpan: 0.72
    blurb: "The e-buggy is parked here under a cloth. Needs charge to move. Power cable and outlet, electrical gear, a voltage meter, assorted tools."
  - id: large-bay
    level: first
    x: 0
    y: 2
    w: 4
    h: 3
    label: "Large Bay"
    icon: "🚜"
    note: "2 stories"
    rollDoor: north # bigger two-story roll-up, same (north) wall / driveway
    rollSpan: 0.6
    blurb: "Open to the roof. Empty now, but the tire tracks and oil stains say something big was housed and serviced here — gone elsewhere on the compound."
  - id: garage-stair
    levels: [first, second]
    feature: garage-stair
    label: "Garage Stairs"
    blurb: "A straight run of steps from the large bay up to the conference room landing. A closed door at the top leads into the second floor."
  - id: spiral-stair
    levels: [first, second]
    feature: spiral-stair
    label: "Spiral Stair"
    blurb: "A glass half-cylinder with a spectacular view of the cascade. White noise from the river fills the stairwell. A good place to pause and take in the view or hold a semi-private conversation."

  # ---------------- 2nd floor ----------------
  - id: conference
    level: second
    x: -1
    y: 0
    w: 3
    h: 2
    label: "Conference Room"
    icon: "🪑"
    windows: [west]
    blurb: "Table, chairs, and dirty windows framing the river rapids and sloping valley."
  - id: kitchen
    level: second
    x: 2
    y: 0
    w: 2
    h: 2
    label: "Kitchen / Dining"
    icon: "🍽️"
    windows: [west] # river side
    blurb: "Worker kitchen and dining area. Water purifier, rations, dishes and utensils. Small table with kitchen chairs."
  - id: bay-open
    level: second
    x: 0
    y: 2
    w: 4
    h: 3
    label: "Large Bay"
    icon: "🚜"
    note: "2 stories"
    open: true # mezzanine edge — you can't stand here, but it's the same bay
    mirror: large-bay # show like the 1st-floor garage once you've been below
    blurb: "The 2-story high bay, open to the rafters. Enter at the top of the stairs."

# Connectivity. Door-kind links name a `door` id; movement requires that door open.
links:
  - { from: small-bay, to: large-bay, kind: open } # one big open garage
  - { from: library, to: hallway, kind: door, door: library-hallway }
  - { from: library, to: corridor, kind: door, door: library-corridor }
  - { from: corridor, to: control-room, kind: door, door: corridor-control }
  - {
      from: control-room,
      to: control-lobby,
      kind: door,
      door: control-room-lobby,
    }
  - {
      from: control-room,
      to: control-bathroom,
      kind: door,
      door: control-room-bathroom,
    }
  - { from: hallway, to: small-bay, kind: door, door: hallway-small-bay }
  - { from: hallway, to: spiral-stair, kind: door, door: hallway-spiral }
  - { from: hallway, to: bathroom, kind: door, door: hallway-bathroom }
  - { from: large-bay, to: garage-stair, kind: stairs }
  - {
      from: garage-stair,
      to: conference,
      kind: door,
      door: conference-garage-stair,
    }
  - { from: conference, to: kitchen, kind: door, door: conference-kitchen }
  - { from: kitchen, to: spiral-stair, kind: door, door: kitchen-spiral }

# Keys and other carry items (inventory ids).
items:
  - id: hallway-small-bay-key
    kind: key
    label: Small bay door key
    description: Brass key for the man door between the hallway and small bay — needed from the garage side.
  - id: lobby-exterior-key
    kind: key
    label: Lobby exterior key
    description: Deadbolt key for the front door — needed from outside on the footpath.
  - id: large-bay-man-key
    kind: key
    label: Large bay man door key
    description: Key for the personnel door at the corner of the large bay.

# Pickups — one-time items found in a room.
pickups:
  - id: lobby-desk-keys
    room: control-lobby
    item: lobby-exterior-key
    label: Keys on the reception desk
  - id: hallway-key-hook
    room: hallway
    item: hallway-small-bay-key
    label: Key on the hallway hook (small bay door)
  - id: large-bay-key-peg
    room: large-bay
    item: large-bay-man-key
    label: Key on the peg by the man door

# Manual release toggles for roll-up doors (disengages the chain hoist).
switches:
  - id: small-bay-manual
    room: small-bay
    door: small-bay-roll
    label: Manual release — small roll-up
  - id: large-bay-manual
    room: large-bay
    door: large-bay-roll
    label: Manual release — large roll-up

# Player actions — room or riverside stand spots. Flags gate the hydro startup chain.
actions:
  - id: eat-rations
    room: kitchen
    verb: Eat
    label: Tastee Tack rations
    require:
      all: [story.the-garage]
      not: [day1.found-food]
    sets: [day1.found-food]

  - id: purify-water
    room: kitchen
    verb: Purify
    label: river water
    require:
      all: [story.the-garage]
      not: [day1.found-water]
    sets: [day1.found-water]

  - id: rest-in-library
    room: library
    label: Rest in the overstuffed chair
    require:
      all: [day1.found-food, day1.found-water]
      not: [day1.complete]
    sets: [day1.complete, story.library-arrival]

  - id: library-read-hydro
    room: library
    verb: Read
    label: about hydro power
    sets: [hydro.discovered]

  - id: read-micro-hydro-ops
    room: control-room
    verb: Read
    label: Micro-hydro Operations
    sets: [hydro.discovered, hydro.outdoor-actions]

  - id: clear-intake-debris
    exteriorNode: upstream-bank
    label: Clear debris
    require:
      all: [hydro.outdoor-actions]
    sets: [hydro.clear-intake-debris]

  - id: align-pipeflow
    exteriorNode: midstream-bank
    label: Align for pipeflow
    require:
      all: [hydro.clear-intake-debris]
    sets: [hydro.align-pipeflow]

  - id: open-turbine-valve
    exteriorNode: downstream-bank
    label: Open valve to turbine
    require:
      all: [hydro.align-pipeflow]
    sets: [hydro.open-turbine-valve]

  - id: connect-power
    room: control-room
    label: Connect power
    require:
      all: [hydro.open-turbine-valve]
    sets: [hydro.level-1-complete, hub.hydro_online]
    powerOn: true

  - id: charge-ev
    room: small-bay
    label: Plug in the EV
    require:
      all: [hub.hydro_online]
    sets: [hub.buggy-charged]

# Doors: topology + visuals + initial state. All start closed.
doors:
  - id: library-hallway
    kind: man
    level: first
    at: { x: 1, y: 0.38 }
    vertical: true
    initial: { closed: true, locked: false }
  - id: library-corridor
    kind: man
    level: first
    at: { x: -1, y: 0.4 }
    vertical: true
    showWhenRoom: library # hidden until library or corridor wing is explored
    initial: { closed: true, locked: false }
  - id: corridor-control
    kind: man
    level: first
    at: { x: -3, y: 0.4 }
    vertical: true
    initial: { closed: true, locked: false }
  - id: control-room-lobby
    kind: man
    level: first
    at: { x: -5, y: 2 }
    initial: { closed: true, locked: false }
  - id: control-room-bathroom
    kind: man
    level: first
    at: { x: -3.5, y: 2 }
    initial: { closed: true, locked: false }
  - id: lobby-exterior
    kind: man
    level: first
    room: control-lobby
    at: { x: -4.4, y: 3 } # east / bottom wall — exterior entry
    label: "Lobby exterior door"
    lock:
      key: lobby-exterior-key
      freeFrom: control-lobby # thumb turn inside the lobby
    initial: { closed: true, locked: true }
  - id: hallway-spiral
    kind: man
    level: first
    selfClosing: true # push-through stair door — passable while shut
    at: { x: 1.68, y: 0.04 } # west wall — spiral exitDown (hallway / south end)
    initial: { closed: true, locked: false }
  - id: hallway-small-bay
    kind: man
    level: first
    at: { x: 2, y: 0.38 }
    vertical: true
    lock:
      key: hallway-small-bay-key
      freeFrom: hallway # lock/unlock from hallway without a key
    initial: { closed: true, locked: true }
  - id: hallway-bathroom
    kind: man
    level: first
    at: { x: 1.5, y: 0.8 }
    initial: { closed: true, locked: false }
  - id: large-bay-man
    kind: man
    level: first
    room: large-bay
    at: { x: 0.6, y: 5 }
    label: "Large bay man door"
    lock:
      key: large-bay-man-key
      freeFrom: large-bay
    initial: { closed: true, locked: true }
  - id: small-bay-roll
    kind: roll
    room: small-bay
    lock:
      kind: enabler
      enablers: [power, manual]
    initial: { closed: true, locked: true }
  - id: large-bay-roll
    kind: roll
    room: large-bay
    lock:
      kind: enabler
      enablers: [power, manual]
    initial: { closed: true, locked: true }
  - id: conference-kitchen
    kind: man
    level: second
    at: { x: 2, y: 1.0 }
    vertical: true
    initial: { closed: true, locked: false }
  - id: conference-garage-stair
    kind: man
    onLevels: [first, second] # top of the garage stair run — same spot on both plans
    at: { x: 1.62, y: 2 }
    showWhenRoom: large-bay # visible from the garage once you've arrived
    initial: { closed: true, locked: false }
  - id: kitchen-spiral
    kind: man
    level: second
    selfClosing: true
    at: { x: 2.32, y: 0.04 }
    initial: { closed: true, locked: false }

fixtures:
  - id: spiral-stair
    kind: spiral-stairs
    at: { x: 2, y: 0 }
    protrude: west
    radius: 0.66
    onLevels: [first, second]
    connects: [kitchen, hallway]
  - id: garage-stair
    kind: straight-stairs
    rect: { x: 0.2, y: 2.08, w: 1.55, h: 0.5 }
    run: horizontal
    ascend: end
    onLevels: [first, second]
    connects: [large-bay, conference] # visual up/down; travel uses garage-stair room + door link
