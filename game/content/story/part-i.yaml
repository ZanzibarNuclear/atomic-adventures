# Part I — Day 1 narrative
# Prose in the narrative card; choices appear under "Choose an Action" in the play panel.
# Choice effects (optional): sets, go_hex, go_room, enter (building)
#
# Outdoor journey (map.yaml `journey`): one beat per hex on the westward path —
# trailhead → east-pines → center-pines → north-bend → gate-woods → utility-yard.
# Off-trail hexes have no Day-1 beats unless added later.

area: part-i
name: "Day 1 — Into the Station"

beats:
  intro:
    once: true
    eyebrow: Day 1 · Opening
    heading: Lost in the woods
    trigger:
      place: outdoors
      hex: trailhead
    text: |
      Zanzibar had been walking in the forest for days. He parted company with
      his small group of explorers, following an unshakable intuition to go uphill toward the west. The others thought it best to stay on the road around toward the east. 

      Now the situation is growing desperate. Food and water are running
      low, and his hunch has yet to play out.

      Not one to wallow, Zanzibar parries desperation with optimism.
      Things will be better. He will survive.
    revisit: |
      The trail west through the pines. Zanzibar's stomach reminds him how far
      he has come and how far he still has to go.
    choices:
      - text: Keep walking west
        sets: [story.intro]
        go_hex: east-pines

  east-pines:
    once: true
    eyebrow: Day 1
    heading: West through the pines
    trigger:
      place: outdoors
      hex: east-pines
    require:
      all: [story.intro]
    text: |
      Early afternoon on a pleasant summer day. The sun is still high, the weather
      is pleasant, a gentle warm breeze meets his face. Fresh pine scent keeps him
      alert. His fasting stomach gives an edge to his senses.

      At the split in the path, he was certain the best strategy was to head west.
      Everyone else thought east was better. What seemed like a path dwindled to a
      suggestion, then nothing at all but pine cones among the tall trees. 

      Turning back would be a mistake.
    revisit: |
      Tall pines and a fading trail west. Hunger and thirst are constant companions
      now.
    choices:
      - text: Continue west on the trail
        sets: [story.east-pines]
        go_hex: center-pines

  lower-stand:
    once: true
    eyebrow: Day 1
    heading: Westward through the pines
    trigger:
      place: outdoors
      hex: lower-stand
    require:
      all: []
    text: |
      You are surrounded by mature pines.
    revisit: |
      Tall pines and solitude. Hunger and thirst are constant companions
      now.
    choices:
      - text: Head west
        sets: [story.lower-stand]
        go_hex: south-pines

  center-pines:
    once: true
    eyebrow: Day 1
    heading: The fence line
    trigger:
      place: outdoors
      hex: center-pines
    require:
      all: [story.east-pines]
    text: |
      After a time, Zanzibar found a sign of humanity. A chain-link
      fence covered in thick vines grew out of the ground, stretching in a straight
      line up the mountainside. He turned uphill, hoping higher ground would offer
      a vantage point. As he walked, he wondered what was on the other side.
    revisit: |
      The vine-choked fence climbs the slope, blocking westward passage.
    choices:
      - text: Walk north along the fence line
        sets: [story.center-pines]
        go_hex: north-bend
      - text: Head downhill to the south
        sets: [story.center-pines]
        go_hex: south-pines

  north-bend:
    once: true
    eyebrow: Day 1
    heading: Round the Bend
    trigger:
      place: outdoors
      hex: north-bend
    require:
      all: [story.center-pines]
    text: |
      He followed the fence for what might have been half a mile, rounded a corner,
      and headed west. The chain-link gave way to glimpses of graded gravel through
      the trees — a road, and something built to watch over it.
    revisit: |
      The bend in the fence line. The road is close now; the gate not much farther.
    choices:
      - text: Continue west along the fence
        sets: [story.north-bend]
        go_hex: gate-woods

  the-gate:
    once: true
    eyebrow: Day 1
    heading: The compound gate
    trigger:
      place: outdoors
      hex: gate-woods
    require:
      all: [story.north-bend]
    text: |
      Before long: a paved road, a gate, and a guard house — closed and locked.
      Bolt cutters or a blow torch would come in handy. Or a tank.

      As he sipped some water and nibbled at his last energy bar, Zanzibar studied
      the gate. Something seemed off. On closer inspection, the chain holding the
      gate closed was unattached — more theater than security. He slipped through
      and replaced the chain to restore the illusion, then headed down the paved
      road.
    revisit: |
      The gate and guard house. From a distance they look impenetrable; up close,
      the chain was never really locked.
    choices:
      - text: Head down the road
        sets: [story.the-gate]
        go_hex: utility-yard

  the-compound:
    once: true
    eyebrow: Day 1
    heading: The utility station
    trigger:
      place: outdoors
      hex: utility-yard
    require:
      all: [story.the-gate]
    text: |
      The road was in decent shape, obscured by years of pine needle drops. Shrubs
      and thickets lined the way. White noise from running water entered his
      awareness — a stream or river nearby, somewhere over the ridge to the west.

      Half a mile along, a gravel driveway split off toward the sound of rushing
      water. A two-story building stood before him. To the west, a spectacular
      river cascade — not accessible from the driveway.

      A bigger surprise: a large industrial garage. One roll-up door was wider
      and twice the height of the other. Seeing no way to open the roll-ups,
      Zanzibar noted a path around to a man door at the side.
    revisit: |
      The utility station beside the cascade. Tire tracks, silence, and the steady
      roar of water over stone.
    choices:
      - text: Find a way inside
        sets: [story.the-compound]
        enter: building

  the-garage:
    once: true
    eyebrow: Day 1
    heading: Outside the station
    trigger:
      event: enter-building
    require:
      all: [story.the-compound]
    text: |
      Zanzibar stepped onto the footpath beside the building. Whoever left this
      place might have realized they would never return. It seemed an ideal spot
      to take shelter and make sense of things — if he could get in.

      The side door was locked. He had bested more formidable locks before, though
      he would have preferred to leave this one functional. For now, getting inside
      mattered more.
    revisit: |
      The footpath around the garage. Locked doors, charging cables visible
      through grimy windows, and the sound of the falls close by.
    choices:
      - text: Look for a way in
        sets: [story.the-garage]

  large-bay:
    once: true
    eyebrow: Day 1
    heading: The large bay
    trigger:
      place: indoors
      room: large-bay
    require:
      all: [story.the-garage]
    text: |
      He stepped into the larger garage bay — rather empty, but tire marks and oil
      stains made it clear that something large had been parked here. Directly
      opposite, a staircase to a door on the second story. Grimy windows above the
      stairs. Strong posts and beams; a cross beam with pulleys and chains hanging
      down — rigging to unload heavy objects, he imagined.

      Something in the next bay caught his eye. Under a cover, the distinctive
      shape of a small vehicle. He lifted the cover just enough to peek at shiny
      chrome and knobby wheels — a stylish dune buggy. As much fun as that looked,
      his stomach told him to come back later.

      A tool rack, charging cables, and a locked door in the back wall. Perhaps
      the stairs would offer a more civilized entry.
    revisit: |
      The empty large bay. Oil stains, pulleys on the beam, and a covered shape
      in the next bay that might be worth a second look — after food.
    choices:
      - text: Continue exploring
        sets: [story.large-bay]

  conference:
    once: true
    eyebrow: Day 1
    heading: Conference room
    trigger:
      place: indoors
      room: conference
    require:
      all: [story.large-bay]
    text: |
      A bit of good luck at the top of the stairs: the door was unlocked. A stylish
      conference room — formal without being stuffy. A large rustic wooden table
      circled by sturdy chairs. Windows overlooked the garage on one side; larger
      windows on the other must frame a spectacular view, though they needed
      cleaning inside and out.

      Wooden panels at the end of the room slid apart to reveal a large screen.
      Presentations, conference calls, movie night. Whoever stayed here was doing
      more than camping. This was a serious facility. What happened?

      A second door at the back of the room was unlocked. As Zanzibar opened it,
      adrenaline flooded his body with the instant recognition of what he had found.
    revisit: |
      The conference room. Dust on the table, dirty windows, and the lingering
      sense that important work happened here.
    choices:
      - text: See what is through the door
        sets: [story.conference]
        go_room: kitchen

  kitchen:
    once: true
    eyebrow: Day 1
    heading: Kitchen
    trigger:
      place: indoors
      room: kitchen
    require:
      all: [story.conference]
    text: |
      In a facility where people come and go, proper labeling is essential.
      Zanzibar found the rations cabinet in no time.

      Decades ago, food preservation had evolved — nutrition packing, flavor loading,
      irradiation, impenetrable wrapping. Energy bars with a shelf life measured
      in decades. Tastee Tack, harkening back to hardtack. He settled on
      turkey-cranberry. After a couple of bites, he realized how thirsty he was.

      He tried the faucet. It sputtered, then cleared. A container, water purifier
      tablets, a rinsed glass, and a tall drink. He sat at a breakroom table with
      windows framing the flowing water outside. The sun was setting on an amazing
      day.
    revisit: |
      The kitchen. Running water, labeled rations, and a view of the cascade as
      the light fades.
    choices:
      - text: Eat and drink
        sets: [story.kitchen, day1.found-food, day1.found-water]

  library-arrival:
    once: true
    eyebrow: Day 1 · Evening
    heading: The library
    trigger:
      place: indoors
      room: library
    require:
      all: [day1.found-food, day1.found-water]
    text: |
      Shelves of books and manuals, study carrels, soft low seating. One might
      expect nature writing or philosophy in a mountainside library — and there
      were picture books of natural scenes — but the vast majority of material was
      straight out of an elite science and engineering school.

      Natural light from expansive windows was enough on a sunny day. Without
      power, the holo-readers and infopods were silent — immersive learning would
      have to wait.

      White noise from the falls was hypnotic. Fatigue poured over Zanzibar. He
      sank into an overstuffed chair, stretched his legs, and drifted off to sleep.
    revisit: |
      The library. Manuals, holo-readers dark without power, and the murmur of
      the cascade through the walls.
    choices:
      - text: Sleep
        sets: [day1.complete, story.library-arrival]
