# World overview map for Atomic Adventures — Act I opening.
#
# A pine-forest mountainside. Coordinates are AXIAL (q, r), pointy-top.
# Reference: https://www.redblobgames.com/grids/hexagons/
#
# Routes and features (rivers, fences) are continuous polylines in world space.
# A waypoint anchors to a hex (`hex:` with optional `dx`/`dy` offsets in
# hex-size units, -y = north) OR gives raw world coords (`x`, `y`).

orientation: pointy
size: 44

# Entry point + the rough hexes the hero passes through (used for auto-travel).
start: trailhead
journey: [trailhead, east-pines, center-pines, north-bend, high-rocks, utility-yard]

hexes:
  # top row (the slope rises to the north)
  - { id: high-rocks, q: -1, r: -1, terrain: rock, landmark: { icon: "⛰️", name: "High Rocks", dy: -0.45 } }
  - { id: north-bend, q: 0, r: -1, terrain: forest }
  - { id: far-pines, q: 1, r: -1, terrain: forest }
  # middle row
  - { id: west-slope, q: -1, r: 0, terrain: forest }
  - { id: center-pines, q: 0, r: 0, terrain: forest }
  - { id: east-pines, q: 1, r: 0, terrain: forest }
  - { id: trailhead, q: 2, r: 0, terrain: forest }   # avatar starts here (east)
  # bottom row
  - id: utility-yard
    q: -2
    r: 1
    terrain: clearing
    area: utility
    landmark:
      icon: "🏚️"
      name: "Utility Station"
      blurb: "Garage, conference room, kitchen, and a library. The first destination."
  - { id: south-pines, q: -1, r: 1, terrain: forest }
  - { id: lower-stand, q: 0, r: 1, terrain: forest }

# Geographic features. Not walkable; drawn beneath the routes.
features:
  # River runs down the far west, flowing south.
  - id: mountain-river
    kind: river
    smooth: true
    flow: south
    points:
      - { x: -150, y: -118 }
      - { x: -162, y: -62 }
      - { x: -152, y: -8 }
      - { x: -166, y: 42 }
      - { x: -154, y: 92 }
      - { x: -168, y: 138 }

  # The fence is an L: a north-south run, a right-angle corner, then a west run.
  # The west run has a narrow GATE gap (between -74 and -88) for the hero.
  - id: fence-run-south
    kind: fence
    points:
      - { x: -30, y: 140 }
      - { x: -30, y: -64 }   # corner
  - id: fence-run-west-a
    kind: fence
    points:
      - { x: -30, y: -64 }   # corner
      - { x: -74, y: -64 }   # east edge of the gate
  - id: fence-run-west-b
    kind: fence
    points:
      - { x: -88, y: -64 }   # west edge of the gate
      - { x: -205, y: -64 }

  # A road runs N-S beneath the gate, heading south past the station's east
  # side toward the rest of the compound (off-map). A driveway taps off to it.
  - id: compound-road
    kind: road
    points:
      - { x: -81, y: -135 }
      - { x: -81, y: 150 }
  - id: station-driveway
    kind: drive
    points:
      - { x: -81, y: 60 }
      - { x: -98, y: 64 }
      - { x: -114, y: 66 }   # utility station

routes:
  - id: hero-route
    kind: path
    name: the trail
    smooth: true
    points:
      - { x: 152, y: 2 }      # trailhead (avatar, east)
      - { x: 120, y: -6 }     # wavy, drifting slightly uphill (north)...
      - { x: 88, y: 2 }
      - { x: 56, y: -10 }
      - { x: 24, y: -4 }
      - { x: -6, y: -20 }
      - { x: -26, y: -28 }    # meets the fence; can't go west
      - { x: -24, y: -48 }    # turns NORTH, up the east side of the fence
      - { x: -26, y: -60 }
      - { x: -40, y: -72 }    # rounds the corner to the north side
      - { x: -58, y: -74 }    # walks due WEST along the fence
      - { x: -78, y: -74 }
      - { x: -81, y: -72 }    # at the gate...
      - { x: -81, y: -50 }    # squeezes through onto the road
      - { x: -77, y: -10 }    # follows the road south...
      - { x: -77, y: 34 }
      - { x: -79, y: 58 }     # ...to where the driveway taps off
      - { x: -96, y: 62 }     # follows the driveway west
      - { x: -114, y: 66 }    # utility station
