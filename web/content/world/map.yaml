# World overview map for Atomic Adventures — Act I opening.
#
# HEX REFERENCE
# -------------
# Each hex has a unique `id` (kebab-case) — use this in story, flags, and code.
# Layout uses axial coordinates (q, r), pointy-top. North = decreasing r / screen-up.
#   https://www.redblobgames.com/grids/hexagons/
#
# Authoring routes & features: anchor waypoints to a hex with optional offsets
#   { hex: utility-yard, dx: -0.3, dy: 0.1 }
# dx/dy are in hex-size units (-y = north). Raw { x, y } world coords still work.
#
# Grid sketch (r increases downward on the slope):
#
#              high-rocks (0,-3)  ⛰️
#    upper-gorge (-1,-2)  road-fork (0,-2)   north-bend (0,-1)   far-pines (1,-1)
#    north-west (-2,-1)  gate-woods (-1,-1)   …
#       mid-west (-2,0)  west-slope (-1,0)   center-pines (0,0) …  trailhead (2,0)
#  utility-yard (-2,1) 🏚️  south-pines (-1,1)  lower-stand (0,1)
#
# River: high-rocks → upper-gorge → … → utility-yard (cascade) → off SW.
# Roads: compound-road (paved) gate ↔ north ↔ NE stub at road-fork (0,-2).
#        river-access-drive (granite) — side road from road-fork west to the river.

orientation: pointy
size: 44

start: trailhead
journey: [trailhead, east-pines, center-pines, north-bend, gate-woods, utility-yard]

hexes:
  # --- North slope (river headwaters) ---
  - { id: high-rocks, q: 0, r: -3, terrain: rock, landmark: { icon: "⛰️", name: "High Rocks", dy: -0.45 } }
  - { id: upper-gorge, q: -1, r: -2, terrain: forest }
  - { id: road-fork, q: 0, r: -2, terrain: forest }
  - { id: north-west, q: -2, r: -1, terrain: forest }
  - { id: north-bend, q: 0, r: -1, terrain: forest }
  - { id: far-pines, q: 1, r: -1, terrain: forest }

  # Gate approach
  - id: gate-woods
    q: -1
    r: -1
    terrain: forest
    puzzle: gate
    standAt: { x: -81, y: -58 }
    landmark:
      name: Compound Gate
      blurb: A locked gate and a guard booth. The fasteners look like a tavern puzzle — something clever must open the way through.

  # --- West slope: NW of utility-yard, and SE of gate-woods (fills the grid) ---
  - { id: mid-west, q: -2, r: 0, terrain: forest }
  - { id: west-slope, q: -1, r: 0, terrain: forest }

  # --- Main trail row ---
  - { id: center-pines, q: 0, r: 0, terrain: forest }
  - { id: east-pines, q: 1, r: 0, terrain: forest }
  - { id: trailhead, q: 2, r: 0, terrain: forest }

  # --- South / compound ---
  - id: utility-yard
    q: -2
    r: 1
    terrain: clearing
    area: utility
    cascade: true
    landmark:
      icon: "🏚️"
      name: "Utility Station"
      dx: 0.32
      dy: 0.05
      blurb: "Built beside a rocky cascade on the river — the hydro intake for Part I. Garage, conference room, kitchen, and library inside."
  - { id: south-pines, q: -1, r: 1, terrain: forest }
  - { id: lower-stand, q: 0, r: 1, terrain: forest }

features:
  # River runs west of the station (bank between water and building), then exits SW.
  - id: mountain-river
    kind: river
    smooth: true
    flow: south
    points:
      - { hex: high-rocks, dx: -0.15, dy: -0.15 }
      - { hex: upper-gorge, dx: -0.3, dy: 0.05 }
      - { hex: north-west, dx: -0.28, dy: 0.08 }
      - { hex: mid-west, dx: -0.3, dy: 0.05 }
      - { hex: utility-yard, dx: -0.42, dy: -0.12 }
      - { hex: utility-yard, dx: -0.4, dy: 0.18 }
      - { x: -188, y: 118 }

  - id: fence-run-south
    kind: fence
    points:
      - { x: -30, y: 140 }
      - { x: -30, y: -50 }
  - id: fence-run-west
    kind: fence
    points:
      - { x: -30, y: -50 }
      - { x: -205, y: -50 }

  - id: compound-gate
    kind: gate
    hex: gate-woods
    at: { x: -94, y: -58 }
    labelAt: { x: -81, y: -42 }
    name: Gate

# Roads: compound-road (paved) runs gate → north → NE around High Rocks.
#        river-access-drive (decomposed granite) branches west in road-fork to the river.

  - id: compound-road
    kind: road
    smooth: true
    points:
      # South — through the gate into the compound
      - { x: -81, y: 150 }
      - { x: -81, y: 60 }
      - { x: -81, y: -40 }
      - { x: -81, y: -58 }
      # North — main road continues to road-fork and NE (around High Rocks; stub)
      - { x: -81, y: -88 }
      - { x: -81, y: -115 }
      - { hex: road-fork, dx: -0.1, dy: 0.15 }
      - { hex: road-fork, dx: 0.08, dy: -0.05 }
      - { hex: road-fork, dx: 0.42, dy: -0.72 }

  # Side access: decomposed-granite drive from the main road down to the upper river.
  - id: river-access-drive
    kind: drive
    points:
      - { hex: road-fork, dx: 0.08, dy: -0.05 }
      - { hex: road-fork, dx: -0.18, dy: 0.08 }
      - { hex: upper-gorge, dx: -0.12, dy: 0.06 }
      - { hex: upper-gorge, dx: -0.22, dy: 0.05 }

  - id: station-driveway
    kind: drive
    points:
      - { x: -81, y: 60 }
      - { x: -92, y: 64 }
      - { hex: utility-yard, dx: 0.32, dy: 0.08 }

routes:
  - id: hero-route
    kind: path
    name: the trail
    smooth: true
    points:
      - { x: 152, y: 2 }
      - { x: 120, y: -6 }
      - { x: 88, y: 2 }
      - { x: 56, y: -10 }
      - { x: 24, y: -4 }
      - { x: -6, y: -20 }
      - { x: -26, y: -28 }
      - { x: -24, y: -48 }
      - { x: -26, y: -56 }
      - { x: -40, y: -56 }
      - { x: -58, y: -56 }
      - { x: -78, y: -56 }
      - { x: -81, y: -58 }
      - { x: -81, y: -40 }
      - { x: -77, y: -10 }
      - { x: -77, y: 34 }
      - { x: -79, y: 58 }
      - { x: -96, y: 62 }
      - { hex: utility-yard, dx: 0.32, dy: 0.08 }
