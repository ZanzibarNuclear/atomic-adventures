# Utility Station interior — a top-down floor plan, drawn to match the design
# sketch. TWO floors share one footprint; the Large Bay (garage) is a single
# double-height room, so on the 2nd floor that footprint is "open to below".
#
# Orientation: NORTH points RIGHT (east). The top of each plan is therefore
# WEST — the river side, where the windows and the winding stair live.
#
# Stacking:  Conference sits over Library; Kitchen sits over Small Bay;
#            the Large Bay spans both floors.
# Stairs:    Large Bay (garage) --straight stairs--> Conference (2nd floor)
#            Kitchen --winding 180° river-side stairs--> Library (1st floor)

name: Utility Station
cell: 64
gridFeet: 10 # light floor-grid lines every 10 feet
unitFeet: 10 # one layout unit (room x/y/w/h) = 10 feet
start: large-bay
north: right # the compass arrow points right, per the sketch

# Highest order is the top floor.
levels:
  - { id: second, name: "2nd Floor", order: 1 }
  - { id: first, name: "1st Floor", order: 0 }

rooms:
  # ---------------- 1st floor (ground) ----------------
  - id: library
    level: first
    x: 0
    y: 0
    w: 2
    h: 2
    name: "Library / Study"
    icon: "📚"
    windows: [top] # west / river side
    blurb: "Shelves, manuals, log binders, and three holo-reader stations. River windows behind the blinds."
  - id: small-bay
    level: first
    x: 2
    y: 0
    w: 2
    h: 2
    name: "Small Bay"
    icon: "🔧"
    note: "1 story · EV bay"
    rollDoor: right # single-story roll-up onto the driveway (north wall)
    rollSpan: 0.72
    blurb: "Tools, electrical gear, and a voltage meter. The e-buggy is parked here under a cloth — dead flat, no charge."
  - id: large-bay
    level: first
    x: 0
    y: 2
    w: 4
    h: 3
    name: "Large Bay"
    icon: "🅿️"
    note: "2 stories"
    rollDoor: right # bigger two-story roll-up, same (north) wall / driveway
    rollSpan: 0.6
    blurb: "Open to the roof. Empty now, but the tire tracks and oil stains say something big was housed and serviced here — gone elsewhere on the compound."

  # ---------------- 2nd floor ----------------
  - id: conference
    level: second
    x: 0
    y: 0
    w: 2
    h: 2
    name: "Conference Room"
    icon: "🪑"
    windows: [top]
    blurb: "Table, chairs, and dirty windows framing the river rapids."
  - id: kitchen
    level: second
    x: 2
    y: 0
    w: 2
    h: 2
    name: "Kitchen / Dining"
    icon: "🍽️"
    blurb: "Worker kitchen and dining area with a water purifier and rations."
  - id: bay-open
    level: second
    x: 0
    y: 2
    w: 4
    h: 3
    name: "Large Bay"
    icon: "🅿️"
    note: "2 stories"
    open: true # mezzanine edge — you can't stand here, but it's the same bay
    mirror: large-bay # show like the 1st-floor garage once you've been below
    blurb: "The tall bay opens below your feet all the way to the roof. A railing keeps you back from the edge."

# Connectivity only (movement). kind: door | open | stairs | winding-stairs.
# `open` = no wall (one big garage). Up/down inferred from level order.
links:
  - { from: small-bay, to: large-bay, kind: open } # one big open garage
  - { from: library, to: small-bay, kind: door } # man-door, library NE corner
  - { from: large-bay, to: conference, kind: stairs } # garage stair up to 2F
  - { from: conference, to: kitchen, kind: door }
  - { from: kitchen, to: library, kind: winding-stairs } # river-side spiral

# Stair fixtures drawn over the plan (the actual stairs + glyphs).
fixtures:
  - id: spiral-stair
    kind: spiral-stairs
    at: { x: 2, y: 0 } # top-center, on the river wall between the west rooms
    protrude: top # half-cylinder of glass bulges out toward the cascade
    radius: 0.66
    onLevels: [first, second]
    connects: [kitchen, library]
  - id: garage-stair
    kind: straight-stairs
    # Runs along the large bay's west (top) wall, in the south (left) half;
    # ascends west→east to the 2F door into the conference room.
    rect: { x: 0.2, y: 2.08, w: 1.55, h: 0.5 }
    run: horizontal
    ascend: end # high (top) end is the far (east/right) side, by the door
    onLevels: [first, second] # visible on both floors so you can go back down
    connects: [large-bay, conference]

# Authored man-door glyphs (visual only — 6 total). `at` is in grid units;
# `vertical: true` for a door on a north/south (vertical) wall.
doors:
  # --- 1st floor ---
  - { level: first, at: { x: 0.6, y: 5 } } # garage break-in, east wall, toward the back (south)
  - { level: first, at: { x: 2, y: 1.62 }, vertical: true } # library ↔ small bay, NE corner of library
  - { level: first, at: { x: 1.68, y: 0.04 } } # foot of the spiral, into the library
  # --- 2nd floor ---
  - { level: second, at: { x: 2, y: 1.0 }, vertical: true } # conference ↔ kitchen
  - { level: second, at: { x: 1.62, y: 2 } } # top of garage stair, into the conference room
  - { level: second, at: { x: 2.32, y: 0.04 } } # top of the spiral, into the kitchen
